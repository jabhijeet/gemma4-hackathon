name: littlemind_ai
description: A powerful and intuitive AI assistant built for the LittleMind ecosystem.
version: 1.1.1+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  flutter_spinkit: ^5.2.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  provider: ^6.1.5+1
  flutter_secure_storage: ^10.0.0
  flutter_markdown_plus: ^1.0.0
  encrypt: ^5.0.3


flutter:
  uses-material-design: true
  assets:
    - assets/prompts/

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#4A90D9"
    theme_color: "#4A90D9"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
